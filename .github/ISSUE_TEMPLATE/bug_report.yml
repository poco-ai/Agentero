name: Bug 反馈
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先查看 [常见问题与诊断](https://agentero-docs.poco-ai.com/usage/help/)。如果问题仍可复现，请填写操作步骤、实际结果和环境。

  - type: textarea
    id: description
    attributes:
      label: 实际结果与预期
      placeholder: 例如：点击「打开知识库」后界面没有变化，预期会弹出目录选择窗口。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 Agentero。
        2. 在欢迎页点击「打开知识库」。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 填写操作系统、应用版本和安装方式。
      placeholder: |
        - 系统:
        - Agentero 版本:
        - 安装方式: 官网下载 / Homebrew / 自行编译
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可以附上错误提示、截图或相关日志片段。请先删掉密钥、配对链接和私人路径。
