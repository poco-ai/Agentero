name: 功能建议
description: 提议一个新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题或场景
      description: 你当时想做什么？遇到了什么困难？
      placeholder: 比如我想找某个标签下还没读的论文，现在只能逐条翻找。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望 Agentero 怎么做？
      placeholder: 比如在论文库表头加一个「未读」筛选，可以和标签一起选。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你还试过或考虑过哪些做法？

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有助于理解该建议的信息、截图或参考链接
