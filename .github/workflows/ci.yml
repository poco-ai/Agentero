name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - quality
          - test-1
          - test-2
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run TypeScript checks
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            quality)
              pnpm exec biome ci .
              pnpm typecheck
              ;;
            test-1)
              pnpm exec vitest run --shard=1/2
              ;;
            test-2)
              pnpm exec vitest run --shard=2/2
              ;;
            *)
              echo "::error::Unknown TypeScript CI task: ${{ matrix.task }}"
              exit 1
              ;;
          esac

  rust:
    name: Rust (${{ matrix.task }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        task:
          - quality
          - agentero-tests
          - cli-tests
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Provision PDFium
        shell: bash
        run: |
          set -euo pipefail
          # liteparse-pdfium-sys fetches PDFium in its build script into an OS
          # cache dir that Swatinem/rust-cache does not persist. On a cache hit
          # the build script is skipped, so libpdfium.dylib is absent when tests
          # dlopen it. Provision it explicitly and point both the build script
          # and the runtime loader at a stable directory. Keep the tag in sync
          # with liteparse-pdfium-sys (currently chromium/7897).
          tag="chromium/7897"
          case "$(uname -m)" in
            arm64 | aarch64) asset="pdfium-mac-arm64" ;;
            *) asset="pdfium-mac-x64" ;;
          esac
          dest="$RUNNER_TEMP/pdfium"
          mkdir -p "$dest"
          url="https://github.com/run-llama/pdfium-binaries/releases/download/${tag/\//%2F}/${asset}.tgz"
          echo "Downloading $url"
          curl -fsSL "$url" | tar -xz -C "$dest"
          test -f "$dest/lib/libpdfium.dylib"
          test -d "$dest/include"
          echo "PDFIUM_LIB_PATH=$dest/lib" >> "$GITHUB_ENV"
          echo "PDFIUM_INCLUDE_PATH=$dest/include" >> "$GITHUB_ENV"
      - name: Stub bundled binaries for Tauri externalBin
        # tauri.conf.json lists the CLI and Voice sidecar; build-script requires
        # both triple-suffixed files even for lib/tests (not only app bundles).
        run: node scripts/prepare-bundled-cli.mjs --stub
      - name: Run Rust checks
        run: |
          set -euo pipefail
          case "${{ matrix.task }}" in
            quality)
              cargo fmt --all --check
              cargo clippy --workspace --all-targets -- -D warnings
              ;;
            agentero-tests)
              cargo test -p agentero
              ;;
            cli-tests)
              cargo test -p agentero-cli
              cargo build -p agentero-cli
              ;;
            *)
              echo "::error::Unknown Rust CI task: ${{ matrix.task }}"
              exit 1
              ;;
          esac
