name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Shared draft so installers + CLI can upload in parallel without racing create.
  prepare:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY. Refusing to publish an unsigned updater release."
            exit 1
          fi
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          fi

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Agentero ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Installers and CLI for Agentero ${{ github.ref_name }}.

            ## Desktop
            Platform installers from Tauri (see assets below).

            ## Android
            `Agentero_<version>_aarch64.apk` — arm64 devices, Android 7.0+.
            Sideload it directly; the app is a remote client for your desktop Vault.

            ## CLI (`agentero`)
            Headless Vault / Catalog machine interface (no BYOA). **Bundled with the desktop app** at the same version.

            After installing the desktop app:
            - **Windows / Linux**: installers expose `agentero` on PATH when possible.
            - **macOS (DMG)**: Settings → About → **Install CLI** (writes `~/.local/bin/agentero`; does not edit shell rc).
            - Standalone CLI archives remain available for headless-only machines.

            ```bash
            agentero --version
            agentero open ~/research   # or: agentero ~/research
            agentero vault which --json
            ```

            Source install (slow; pulls desktop Rust deps):
            ```bash
            cargo install --git https://github.com/${{ github.repository }} --tag ${{ github.ref_name }} --locked --package agentero-cli
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installers:
    name: Installers (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, ubuntu-24.04-arm, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Bundle same-version headless CLI into the desktop artifact (externalBin).
      # `beforeBuildCommand` also runs `pnpm cli:bundle:release`; this pre-step
      # makes the triple-suffixed binary available for tauri-build early checks.
      - name: Prepare bundled CLI
        run: pnpm cli:bundle:release

      # macOS: Developer ID signing + notarytool (see docs/development/macos-signing.md).
      # Without APPLE_CERTIFICATE the build still runs unsigned (existing behavior).
      # Do NOT pass empty APPLE_TEAM_ID/APPLE_ID via the build env — empty strings make
      # Tauri/notarytool fail with "Team ID must be at least 3 characters".
      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "::warning::APPLE_CERTIFICATE not configured; macOS installer will be unsigned"
            exit 0
          fi
          echo "APPLE_CERTIFICATE present — Tauri will import the .p12 and codesign"

          if [[ -n "${APPLE_API_KEY_P8:-}" && -n "${APPLE_API_KEY:-}" ]]; then
            KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
            if [[ "$APPLE_API_KEY_P8" == -----BEGIN* ]]; then
              printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            else
              # Accept base64-encoded PEM (avoids multiline secret edge cases)
              echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
            fi
            chmod 600 "$KEY_PATH"
            echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
            echo "App Store Connect API key written for notarytool"
            if [[ -n "${APPLE_API_ISSUER:-}" && ! "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F-]{36}$ ]]; then
              echo "::warning::APPLE_API_ISSUER does not look like a UUID; Team API keys require Issuer ID format xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
            fi
          else
            if [[ -n "${APPLE_ID:-}" ]]; then
              echo "APPLE_ID=${APPLE_ID}" >> "$GITHUB_ENV"
              echo "Notarization will use APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID"
            else
              echo "::warning::No notarization credentials (APPLE_API_KEY_P8 or APPLE_ID); signed app may not be notarized"
            fi
          fi

          # Only export Apple ID password / team id when non-empty (empty breaks notarytool).
          if [[ -n "${APPLE_PASSWORD:-}" ]]; then
            echo "APPLE_PASSWORD=${APPLE_PASSWORD}" >> "$GITHUB_ENV"
          fi
          TEAM="${APPLE_TEAM_ID:-}"
          if [[ -z "$TEAM" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            # "Developer ID Application: Name (TEAMID)" → TEAMID
            if [[ "$APPLE_SIGNING_IDENTITY" =~ \(([A-Z0-9]{10})\)$ ]]; then
              TEAM="${BASH_REMATCH[1]}"
              echo "Derived APPLE_TEAM_ID from APPLE_SIGNING_IDENTITY"
            fi
          fi
          if [[ -n "$TEAM" && ${#TEAM} -ge 3 ]]; then
            echo "APPLE_TEAM_ID=${TEAM}" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signature, independent from Apple code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Developer ID Application (.p12 base64) + password — see macos-signing.md
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Optional if the .p12 contains a single identity, e.g.
          # "Developer ID Application: Your Name (TEAMID)"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Preferred notarization auth (App Store Connect API key)
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # APPLE_API_KEY_PATH, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID come from
          # the prepare step via GITHUB_ENV only when non-empty.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Agentero ${{ github.ref_name }}
          # Body is set by the prepare job; keep draft + same tag.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The action merges per-platform signed artifacts into latest.json.
          # NSIS supports user-level update installation; prefer it over MSI.
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

  # Android ships its own signed APK into the same draft. Kept out of the
  # `installers` matrix because it needs the Android SDK/NDK and a keystore
  # instead of per-OS desktop toolchains. The matrix is the ABI list: add
  # armv7 / x86_64 here if those devices ever need coverage.
  android:
    name: Android (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            ndk: "29.0.14206865"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Android signing configuration
        id: signing-config
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for VAR in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!VAR:-}" ]]; then
              missing+=("$VAR")
            fi
          done

          # An unsigned release APK cannot be installed, so skip rather than
          # publish a broken asset — the desktop release still goes out.
          if ((${#missing[@]} > 0)); then
            echo "::warning::Skipping Android APK because signing secrets are missing: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        if: steps.signing-config.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        if: steps.signing-config.outputs.ready == 'true'
        env:
          NDK_VERSION: ${{ matrix.ndk }}
        run: |
          set -euo pipefail
          # `yes` dies with SIGPIPE (141) once sdkmanager stops reading; under
          # pipefail that would fail the step even when the install succeeded.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        if: steps.signing-config.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.signing-config.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        if: steps.signing-config.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-linux-android

      - name: Install frontend dependencies
        if: steps.signing-config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install release keystore
        if: steps.signing-config.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          cat > src-tauri/gen/android/app/keystore.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          storeFile=${KEYSTORE_PATH}
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          EOF

      - name: Build signed APK
        if: steps.signing-config.outputs.ready == 'true'
        run: pnpm tauri android build --apk --target ${{ matrix.target }}

      - name: Package APK
        if: steps.signing-config.outputs.ready == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          if [[ ! -f "$SRC" ]]; then
            echo "::error::APK not found at ${SRC}"
            exit 1
          fi
          OUT_DIR="dist-android"
          mkdir -p "$OUT_DIR"
          ASSET="Agentero_${VERSION}_${TARGET}.apk"
          mv "$SRC" "${OUT_DIR}/${ASSET}"
          (cd "$OUT_DIR" && sha256sum "$ASSET" > "${ASSET}.sha256")
          echo "APK_ASSET=${OUT_DIR}/${ASSET}" >> "$GITHUB_ENV"
          ls -la "$OUT_DIR"

      - name: Upload APK to GitHub Release
        if: steps.signing-config.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ${{ env.APK_ASSET }}
            dist-android/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli:
    name: CLI (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, ubuntu-24.04-arm, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # agentero-cli path-depends agentero_lib (Tauri), so Linux still needs WebKit link libs.
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # agentero package runs tauri-build which requires every externalBin on
      # disk even when only building the headless CLI.
      - name: Stub externalBin for Tauri build-script
        run: node scripts/prepare-bundled-cli.mjs --stub

      - name: Build agentero CLI (release)
        run: cargo build -p agentero-cli --release

      - name: Package CLI artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          OUT_DIR="dist-cli"
          mkdir -p "$OUT_DIR"

          STAGE="agentero-cli-${VERSION}-${HOST}"
          mkdir -p "$STAGE"
          # Cargo bin is `agentero-cli` (no collision with GUI `agentero`);
          # archive still exposes the user-facing name `agentero`.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/release/agentero-cli.exe" "$STAGE/agentero.exe"
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Path '${STAGE}/agentero.exe' -DestinationPath '${OUT_DIR}/${STAGE}.zip' -Force"
            echo "CLI_ASSET=${OUT_DIR}/${STAGE}.zip" >> "$GITHUB_ENV"
          else
            cp "target/release/agentero-cli" "$STAGE/agentero"
            chmod +x "$STAGE/agentero"
            tar -C "$STAGE" -czf "${OUT_DIR}/${STAGE}.tar.gz" agentero
            echo "CLI_ASSET=${OUT_DIR}/${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi
          ls -la "$OUT_DIR"

      - name: Write SHA256 checksum
        shell: bash
        run: |
          cd dist-cli
          sha256sum "$(basename "$CLI_ASSET")" > "$(basename "$CLI_ASSET").sha256"

      - name: Upload CLI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ${{ env.CLI_ASSET }}
            dist-cli/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
