name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  checks:
    name: Validate release commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Shared draft so installers + CLI can upload in parallel without racing create.
  prepare:
    name: Create draft release
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v5

      - name: Validate the bundled changelog
        if: ${{ !contains(github.ref_name, '-') }}
        run: node scripts/validate-release-changelog.mjs "$GITHUB_REF_NAME"

      - name: Verify updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY. Refusing to publish an unsigned updater release."
            exit 1
          fi
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          fi

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Agentero ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ !contains(github.ref_name, '-') && 'src/lib/update/changelog.json' || '' }}
          fail_on_unmatched_files: true
          body: |
            Installers and CLI for Agentero ${{ github.ref_name }}.

            ## Desktop
            Platform installers from Tauri (see assets below).
            Windows ARM64 ships as the `arm64-setup.exe` NSIS installer (no MSI); the installed app is native ARM64.

            ## Android
            `Agentero_<version>_aarch64.apk` — arm64 devices, Android 7.0+.
            Sideload it directly; the app is a remote client for your desktop Vault.

            ## CLI (`agentero`)
            Desktop installers include a same-version offline CLI for Agent turns.
            Settings → About → **Install CLI** copies the executable and PDFium into a versioned user directory and installs a PATH entry. If the local files are unavailable, Settings downloads the matching archive and verifies its SHA-256.
            Standalone archives below include the command and matching PDFium for headless machines. On Windows the Settings-installed command is `agentero-cli`.

            ```bash
            agentero --version
            agentero vault create ./research
            agentero --vault ./research paper list --json
            ```

            Cargo installs the source build as `agentero-cli`. Use the archive above for a self-contained installation with the matching PDFium library.
            ```bash
            cargo install --git https://github.com/${{ github.repository }} --tag ${{ github.ref_name }} --locked --package agentero-cli
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installers:
    name: Installers (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: macos-15-intel
          - platform: ubuntu-22.04
          - platform: ubuntu-24.04-arm
          - platform: windows-latest
            msvc_arch: x64
          # Native ARM64 runner; NSIS is the only bundle target Tauri supports
          # for aarch64 Windows (MSI requires WiX x86/x64). The installer itself
          # stays x86 and runs under Windows 11 emulation; the app is ARM64.
          - platform: windows-11-arm
            msvc_arch: arm64
            tauri_args: --target aarch64-pc-windows-msvc --bundles nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # Native ARM64 toolchain on windows-11-arm. Without this the action
          # defaults to x64, which would build the C dependencies (SQLite,
          # leptonica/tesseract) for the wrong architecture.
          arch: ${{ matrix.msvc_arch }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # macOS: Developer ID signing + notarytool.
      # Without APPLE_CERTIFICATE the build still runs unsigned (existing behavior).
      # Do NOT pass empty APPLE_TEAM_ID/APPLE_ID via the build env — empty strings make
      # Tauri/notarytool fail with "Team ID must be at least 3 characters".
      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "::warning::APPLE_CERTIFICATE not configured; macOS installer will be unsigned"
            exit 0
          fi
          # Tauri distinguishes an absent variable from an empty value.
          # Export the certificate pair only for this macOS job. Use a
          # multiline-safe environment record for base64 or password values.
          export_apple() {
            local key="$1" delimiter
            delimiter="apple_$(openssl rand -hex 16)"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "${!key}" "$delimiter" >> "$GITHUB_ENV"
          }
          export_apple APPLE_CERTIFICATE
          export_apple APPLE_CERTIFICATE_PASSWORD
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then export_apple APPLE_SIGNING_IDENTITY; fi
          echo "APPLE_CERTIFICATE present — Tauri will import the .p12 and codesign"

          if [[ -n "${APPLE_API_KEY_P8:-}" && -n "${APPLE_API_KEY:-}" ]]; then
            KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
            if [[ "$APPLE_API_KEY_P8" == -----BEGIN* ]]; then
              printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            else
              # Accept base64-encoded PEM (avoids multiline secret edge cases)
              echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
            fi
            chmod 600 "$KEY_PATH"
            echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"
            export_apple APPLE_API_KEY
            export_apple APPLE_API_ISSUER
            echo "App Store Connect API key written for notarytool"
            if [[ -n "${APPLE_API_ISSUER:-}" && ! "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F-]{36}$ ]]; then
              echo "::warning::APPLE_API_ISSUER does not look like a UUID; Team API keys require Issuer ID format xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
            fi
          else
            if [[ -n "${APPLE_ID:-}" ]]; then
              echo "APPLE_ID=${APPLE_ID}" >> "$GITHUB_ENV"
              echo "Notarization will use APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID"
            else
              echo "::warning::No notarization credentials (APPLE_API_KEY_P8 or APPLE_ID); signed app may not be notarized"
            fi
          fi

          # Only export Apple ID password / team id when non-empty (empty breaks notarytool).
          if [[ -n "${APPLE_PASSWORD:-}" ]]; then
            echo "APPLE_PASSWORD=${APPLE_PASSWORD}" >> "$GITHUB_ENV"
          fi
          TEAM="${APPLE_TEAM_ID:-}"
          if [[ -z "$TEAM" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            # "Developer ID Application: Name (TEAMID)" → TEAMID
            if [[ "$APPLE_SIGNING_IDENTITY" =~ \(([A-Z0-9]{10})\)$ ]]; then
              TEAM="${BASH_REMATCH[1]}"
              echo "Derived APPLE_TEAM_ID from APPLE_SIGNING_IDENTITY"
            fi
          fi
          if [[ -n "$TEAM" && ${#TEAM} -ge 3 ]]; then
            echo "APPLE_TEAM_ID=${TEAM}" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v1
        env:
          VITE_AGENTERO_ACCOUNT_SURFACE: "0"
          # macos-latest runners have 7GB RAM, so Node's default ~2GB heap
          # limit is not enough for `vite build` on this bundle.
          NODE_OPTIONS: --max-old-space-size=6144
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PostHog project API key baked in at compile time (build.rs);
          # Empty or absent secret compiles telemetry out.
          AGENTERO_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          # Optional. When all four are set, About feedback lands in that
          # PostHog API survey. Absent secrets still build; feedback is sent
          # as a `feedback submitted` activity event.
          AGENTERO_POSTHOG_SURVEY_ID: ${{ secrets.POSTHOG_SURVEY_ID }}
          AGENTERO_POSTHOG_SURVEY_KIND_ID: ${{ secrets.POSTHOG_SURVEY_KIND_ID }}
          AGENTERO_POSTHOG_SURVEY_MESSAGE_ID: ${{ secrets.POSTHOG_SURVEY_MESSAGE_ID }}
          AGENTERO_POSTHOG_SURVEY_CONTACT_ID: ${{ secrets.POSTHOG_SURVEY_CONTACT_ID }}
          # Built-in provider gateway key, baked in at compile time (build.rs);
          # empty/absent secret still builds, but ships without the built-in
          # provider, so verify it after release.
          AGENTERO_BUILTIN_API_KEY: ${{ secrets.AGENTERO_BUILTIN_API_KEY }}
          # Tauri updater signature, independent from Apple code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The macOS preparation step exports only the selected Apple credentials.
        with:
          # windows-11-arm passes an explicit target + NSIS-only bundle; other
          # entries leave it empty and build for the runner's host.
          args: ${{ matrix.tauri_args }}
          tagName: ${{ github.ref_name }}
          releaseName: Agentero ${{ github.ref_name }}
          # Body is set by the prepare job; keep draft + same tag.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The action merges per-platform signed artifacts into latest.json.
          # NSIS supports user-level update installation; prefer it over MSI.
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

      - name: Verify macOS app CLI, PDFium and signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          APP="$(find target -type d -path '*/release/bundle/macos/Agentero.app' -prune -print -quit)"
          BIN="$APP/Contents/MacOS/agentero-turn"
          test ! -f "$APP/Contents/Resources/cli/agentero-cli"
          node scripts/verify-packaged-cli.mjs "$BIN" "$APP/Contents/Frameworks/libpdfium.dylib"
          if [[ "$SIGNED" == true ]]; then
            codesign --verify --strict "$BIN"
            codesign --verify --deep --strict "$APP"
            SIGNATURE="$(codesign --display --verbose=4 "$BIN" 2>&1)"
            grep -F 'Authority=Developer ID Application:' <<< "$SIGNATURE"
            grep -F 'runtime' <<< "$SIGNATURE"
            if [[ -n "${APPLE_API_KEY_PATH:-}" || ( -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ) ]]; then
              xcrun stapler validate "$APP"
            fi
          fi

      - name: Verify CLI from installed Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find target -type f -path '*/release/bundle/deb/*.deb' -print -quit)"
          ROOT="$RUNNER_TEMP/agentero-deb"
          dpkg-deb -x "$DEB" "$ROOT"
          BIN="$(find "$ROOT" -type f -path '*/cli/agentero-cli' -print -quit)"
          node scripts/verify-packaged-cli.mjs "$BIN" "$(dirname "$BIN")/../pdfium/libpdfium.so"

      - name: Verify CLI from installed Windows NSIS package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target -Recurse -Filter '*-setup.exe' | Where-Object { $_.Directory.Name -eq 'nsis' } | Select-Object -First 1
          if (!$installer) { throw "Missing NSIS installer" }
          $root = Join-Path $env:RUNNER_TEMP 'agentero-nsis'
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$root" -PassThru -Wait
          if ($installed.ExitCode -ne 0) { throw "NSIS exited with $($installed.ExitCode)" }
          node scripts/verify-packaged-cli.mjs "$root/cli/agentero-cli.exe" "$root/pdfium/pdfium.dll"

  # tauri-action writes api.github.com asset URLs into latest.json; anonymous
  # API requests share a 60/hour per-IP quota, so updater downloads 403 behind
  # shared NATs. Rewrite them to CDN download URLs once all installers are up.
  updater-json:
    name: Rewrite updater manifest
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Point updater downloads at the release CDN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: node scripts/rewrite-updater-json.mjs

  # Android ships its own signed APK into the same draft. Kept out of the
  # `installers` matrix because it needs the Android SDK/NDK and a keystore
  # instead of per-OS desktop toolchains. The matrix is the ABI list: add
  # armv7 / x86_64 here if those devices ever need coverage.
  android:
    name: Android (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            ndk: "29.0.14206865"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Android signing configuration
        id: signing-config
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for VAR in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!VAR:-}" ]]; then
              missing+=("$VAR")
            fi
          done

          # An unsigned release APK cannot be installed, so skip rather than
          # publish a broken asset — the desktop release still goes out.
          if ((${#missing[@]} > 0)); then
            echo "::warning::Skipping Android APK because signing secrets are missing: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        if: steps.signing-config.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        if: steps.signing-config.outputs.ready == 'true'
        env:
          NDK_VERSION: ${{ matrix.ndk }}
        run: |
          set -euo pipefail
          # `yes` dies with SIGPIPE (141) once sdkmanager stops reading; under
          # pipefail that would fail the step even when the install succeeded.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        if: steps.signing-config.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.signing-config.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        if: steps.signing-config.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-linux-android

      - name: Install frontend dependencies
        if: steps.signing-config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install release keystore
        if: steps.signing-config.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          cat > src-tauri/gen/android/app/keystore.properties <<EOF
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          storeFile=${KEYSTORE_PATH}
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          EOF

      - name: Build signed APK
        if: steps.signing-config.outputs.ready == 'true'
        run: pnpm tauri android build --apk --target ${{ matrix.target }}

      - name: Package APK
        if: steps.signing-config.outputs.ready == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          if [[ ! -f "$SRC" ]]; then
            echo "::error::APK not found at ${SRC}"
            exit 1
          fi
          OUT_DIR="dist-android"
          mkdir -p "$OUT_DIR"
          ASSET="Agentero_${VERSION}_${TARGET}.apk"
          mv "$SRC" "${OUT_DIR}/${ASSET}"
          (cd "$OUT_DIR" && sha256sum "$ASSET" > "${ASSET}.sha256")
          echo "APK_ASSET=${OUT_DIR}/${ASSET}" >> "$GITHUB_ENV"
          ls -la "$OUT_DIR"

      - name: Upload APK to GitHub Release
        if: steps.signing-config.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ${{ env.APK_ASSET }}
            dist-android/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli:
    name: CLI (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: macos-15-intel
          - platform: ubuntu-22.04
          - platform: ubuntu-24.04-arm
          - platform: windows-latest
            msvc_arch: x64
          # The CLI archive name carries the rust host triple, so this emits
          # agentero-cli-<version>-aarch64-pc-windows-msvc.zip for in-app installs
          # on the ARM64 desktop build.
          - platform: windows-11-arm
            msvc_arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # Native ARM64 toolchain on windows-11-arm; the CLI links the same C
          # dependencies (SQLite, leptonica/tesseract) as the desktop app.
          arch: ${{ matrix.msvc_arch }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # The archive carries the same build of PDFium as the desktop installer.
      - name: Setup Node.js for PDFium staging
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Stage PDFium
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-pdfium.mjs

      - name: Build agentero CLI (release)
        run: cargo build -p agentero-cli --release

      - name: Package CLI artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          OUT_DIR="dist-cli"
          mkdir -p "$OUT_DIR"

          STAGE="agentero-cli-${VERSION}-${HOST}"
          mkdir -p "$STAGE"
          # Cargo bin is `agentero-cli` (no collision with GUI `agentero`);
          # archive still exposes the user-facing name `agentero`.
          # PDFium sits beside that binary. bundled_pdfium_dir looks there;
          # a stock PDFium build is not a substitute.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PDFIUM_NAME="pdfium.dll"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            PDFIUM_NAME="libpdfium.dylib"
          else
            PDFIUM_NAME="libpdfium.so"
          fi
          if [[ ! -f "src-tauri/pdfium/${PDFIUM_NAME}" ]]; then
            echo "refusing to package CLI without src-tauri/pdfium/${PDFIUM_NAME}" >&2
            exit 1
          fi
          cp "src-tauri/pdfium/${PDFIUM_NAME}" "$STAGE/${PDFIUM_NAME}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/release/agentero-cli.exe" "$STAGE/agentero.exe"
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Path '${STAGE}/agentero.exe','${STAGE}/${PDFIUM_NAME}' -DestinationPath '${OUT_DIR}/${STAGE}.zip' -Force"
            echo "CLI_ASSET=${OUT_DIR}/${STAGE}.zip" >> "$GITHUB_ENV"
          else
            cp "target/release/agentero-cli" "$STAGE/agentero"
            chmod +x "$STAGE/agentero"
            tar -C "$STAGE" -czf "${OUT_DIR}/${STAGE}.tar.gz" agentero "${PDFIUM_NAME}"
            echo "CLI_ASSET=${OUT_DIR}/${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi
          UNPACKED="$RUNNER_TEMP/agentero-standalone"
          mkdir -p "$UNPACKED"
          if [[ "${{ runner.os }}" == Windows ]]; then
            unzip -q "$OUT_DIR/$STAGE.zip" -d "$UNPACKED"
            BIN="$UNPACKED/agentero.exe"
          else
            tar -xzf "$OUT_DIR/$STAGE.tar.gz" -C "$UNPACKED"
            BIN="$UNPACKED/agentero"
          fi
          node scripts/verify-packaged-cli.mjs "$BIN" "$UNPACKED/$PDFIUM_NAME"
          ls -la "$OUT_DIR"

      - name: Write SHA256 checksum
        shell: bash
        run: |
          cd dist-cli
          sha256sum "$(basename "$CLI_ASSET")" > "$(basename "$CLI_ASSET").sha256"

      - name: Upload CLI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ${{ env.CLI_ASSET }}
            dist-cli/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
