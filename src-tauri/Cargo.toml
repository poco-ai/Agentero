[package]
name = "agentero"
version = "0.5.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-store = "2.4.3"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-deep-link = "2.4.9"
agent-client-protocol = { version = "1.2.0", features = ["unstable_elicitation"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "process", "io-util", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
thiserror = "2"
which = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
flate2 = "1.1.9"
tar = "0.4.46"
htmd = "0.5.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
notify-debouncer-full = "0.3"
log = "0.4"
tauri-plugin-log = "2.9.0"
async-trait = "0.1.91"
sha2 = "0.11.0"
hex = "0.4.3"
walkdir = "2.5.0"
base64 = "0.22"
encoding_rs = "0.8"
urlencoding = "2"
url = "2"
os_info = "3"
crypto_box = "0.9"
ed25519-dalek = "2"
# Used by lookup batch import (all platforms); also needed by Unix remote vault.
futures-util = "0.3.33"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.12"

# Updates and process relaunch are desktop-only. Mobile distribution is owned by
# its app stores, not the in-app updater.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# LiteParse relies on a desktop PDFium binary. Mobile (iOS/Android) uses the
# paired desktop Host for PDF parsing instead of packaging PDFium in the app.
# Keep this cfg in sync with the gates in src/features/import/pdf_parse/mod.rs
# — desktop (incl. Windows) needs it.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
liteparse = "2.5"

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"

# openssh / sendfd are Unix-only (ControlMaster fd passing). Remote vault SFTP
# is therefore unavailable on Windows until a portable backend lands.
[target.'cfg(unix)'.dependencies]
openssh = { version = "0.11.6", features = ["native-mux"] }
openssh-sftp-client = { version = "0.15.7", features = ["openssh"] }
