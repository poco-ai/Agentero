[package]
name = "agentero"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
liteparse = "2.5"
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-store = "2.4.3"
tauri-plugin-dialog = "2.7.1"
agent-client-protocol = "1.2.0"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "process", "io-util", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
thiserror = "2"
which = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.9"
tar = "0.4.46"
htmd = "0.5.4"
notify-debouncer-full = "0.3"
log = "0.4"
tauri-plugin-log = "2.9.0"
async-trait = "0.1.91"
sha2 = "0.11.0"
hex = "0.4.3"
walkdir = "2.5.0"
base64 = "0.22"
urlencoding = "2"
tauri-plugin-persisted-scope = "2.3.7"

# openssh / sendfd are Unix-only (ControlMaster fd passing). Remote vault SFTP
# is therefore unavailable on Windows until a portable backend lands.
[target.'cfg(unix)'.dependencies]
openssh = { version = "0.11.6", features = ["native-mux"] }
openssh-sftp-client = { version = "0.15.7", features = ["openssh"] }
futures-util = "0.3.33"
