[package]
name = "agentero-cli"
version = "0.2.3"
edition = "2021"
description = "Headless Agentero CLI for Vault / Catalog (no BYOA)"
authors = ["you"]
license = "MIT"
publish = false

[[bin]]
name = "agentero"
path = "src/main.rs"

[dependencies]
agentero_lib = { path = "../src-tauri", package = "agentero" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
dirs = "6"
toml = "0.8"
# Interactive prompts (TTY only; skipped under --json / non-TTY)
inquire = "0.7"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"
