[workspace]
members = ["src-tauri", "cli", "crates/agentero-core", "crates/agentero-mcp", "crates/agentero-plugin-host"]
exclude = ["patches/tesseract-rs"]
resolver = "2"

# Upstream tesseract-rs 0.2.0 (liteparse's OCR build dependency) pins zip 2,
# whose extraction path is affected by GHSA-m665-v7pm-7grj and friends.
# The vendored copy only bumps zip to the patched 9.x line.
[patch.crates-io]
tesseract-rs = { path = "patches/tesseract-rs" }

# Shared dependencies declared once for both members (src-tauri / cli).
# Only version + common features live here; `optional`, target-specific
# sections, and extra features stay in the member crates
# (`{ workspace = true, features = [...] }` merges on top).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio features differ per crate (GUI: sync/rt/time/process/io-util/net;
# CLI: rt-multi-thread/macros; dev: test-util), so declare no features here.
tokio = "1"
dirs = "6"
log = "0.4"
tempfile = "3"

# Profiles only take effect from the workspace root. Shipped binaries were
# unstripped and non-LTO (#320): GUI 76MB, headless CLI 31MB.
[profile.release]
strip = true
lto = true
codegen-units = 1
