[package]
name = "agentero-mcp"
version = "0.18.1"
edition = "2021"
description = "Agentero research tools and MCP stdio and Streamable HTTP transports"
authors = ["you"]
license = "MIT"
publish = false

[dependencies]
agentero-core = { path = "../agentero-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "macros", "signal"] }
log = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.10", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
  "transport-io",
] }
schemars = "1"
specta = { version = "2.0.0-rc.22", features = ["derive"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
tempfile.workspace = true
ring = "0.17"
async-trait = "0.1.91"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-io"] }
