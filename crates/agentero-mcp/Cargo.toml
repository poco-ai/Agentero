[package]
name = "agentero-mcp"
version = "0.15.2"
edition = "2021"
description = "Streamable HTTP MCP server shared by the Agentero desktop app and CLI"
authors = ["you"]
license = "MIT"
publish = false

[dependencies]
agentero-core = { path = "../agentero-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "macros", "signal"] }
log = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "3.1", default-features = false, features = [
  "server",
  "macros",
  "schemars",
  "transport-streamable-http-server",
] }
schemars = "1"
specta = { version = "2.0.0-rc.22", features = ["derive"] }
base64 = "0.22"
async-trait = "0.1.91"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
rmcp = { version = "3.1", default-features = false, features = ["client", "transport-io"] }
