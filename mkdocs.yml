site_name: Agentero 用户指南
site_description: 在 Agentero 中导入、阅读和整理论文
repo_url: https://github.com/poco-ai/agentero
repo_name: poco-ai/agentero
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  logo: assets/agentero-app-icon.svg
  palette:
    scheme: default
    primary: black
    accent: grey
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - 首页: index.md
  - 开始使用:
      - 用户指南: usage/index.md
      - 安装与首次使用: usage/getting-started.md
      - 导入和管理论文: usage/import-papers.md
      - 阅读、标注与整理: usage/read-and-organize.md
      - 同步、发现与写作: usage/more-features.md
  - Agent 与翻译:
      - 接入 Agent: usage/agents.md
      - 接入 GenericAgent ACP: usage/genericagent-acp.md
      - 配置 OpenAI 兼容翻译: usage/translate-openai-compatible.md
  - 连接其他工具:
      - Zotero Connector: usage/zotero.md
      - MCP: usage/mcp.md
      - 远程 Vault: usage/remote-vault.md
      - 移动端: usage/mobile.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - fenced_code
  - codehilite

plugins:
  - meta
  - search

strict: true
