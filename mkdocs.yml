      - 接入 Agent: usage/agents.md
      - 接入 GenericAgent ACP: usage/genericagent-acp.md
      - 用 MCP 连接外部 Agent: usage/mcp.md
      - 移动端: usage/mobile.md
      - 使用 Zotero Connector: usage/zotero.md
      - 打开远程 Vault: usage/remote-vault.md

