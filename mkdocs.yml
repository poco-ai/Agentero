site_name: Agentero 文档
site_description: Agentero 本地优先 Agent 科研工作台文档
repo_url: https://github.com/poco-ai/agentero
repo_name: poco-ai/agentero
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  logo: assets/agentero-app-icon.svg
  palette:
    scheme: default
    primary: black
    accent: grey
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight

