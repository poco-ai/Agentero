site_name: Agentero 文档
site_description: Agentero 本地优先 Agent 科研工作台文档
repo_url: https://github.com/poco-ai/agentero
repo_name: poco-ai/agentero
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  logo: assets/agentero-app-icon.svg
  palette:
    scheme: default
    primary: black
    accent: grey
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - 首页: index.md

  - 架构总览: architecture.md

  - 教程:
      - 快速上手: usage/index.md
      - 安装与首次使用: usage/getting-started.md
      - 导入和管理论文: usage/import-papers.md
      - 阅读、标注与整理: usage/read-and-organize.md
      - 接入 Agent: usage/agents.md
      - 移动端: usage/mobile.md
      - 使用 Zotero Connector: usage/zotero.md
      - 打开远程 Vault: usage/remote-vault.md

  - 前端:
      - 概览: frontend/index.md
      - 工作台壳: frontend/shell.md
      - Dockview 工作区: frontend/workspace.md
      - 文件树: frontend/vault-tree.md
      - 论文库 Library: frontend/library.md
      - 入库 UI: frontend/paper-import.md
      - Markdown 编辑: frontend/markdown.md
      - PDF 阅读与划词: frontend/pdf.md
      - PDF 版面分析（实验）: frontend/pdf-layout-analysis.md
      - Agent 面板: frontend/agent.md
      - 移动端: frontend/mobile.md
      - 双链 UI: frontend/wiki.md
      - 命令面板: frontend/command-palette.md
      - 翻译: frontend/translate.md
      - 设置与主题: frontend/settings.md
      - 组件约定: frontend/components.md

  - 后端:
      - 概览: backend/index.md
      - 数据模型: backend/data-model.md
      - Catalog: backend/catalog.md
      - Vault FS: backend/vault.md
      - 论文入库: backend/paper-import.md
      - Identifier Lookup: backend/identifier-lookup.md
      - 参考文献解析: backend/citation-parsing.md
      - Skill 导入: backend/skill-import.md
      - Zotero Connector: backend/connector.md
      - 双链索引: backend/wiki.md
      - Agent Host: backend/agent.md
      - 远程 Vault: backend/remote.md
      - 搜索: backend/search.md
      - 设置: backend/settings.md
      - 翻译: backend/translate.md
      - 运行日志: backend/logging.md
      - CLI: backend/cli.md
      - API 全表: backend/api.md

  - 开发草稿:
      - 概览: development/index.md
      - 路线图: development/roadmap.md
      - TODO: development/todo.md
      - 内置桌面 CLI: development/bundled-cli.md
      - Word 引用集成: development/zotero-word-integration.md
      - 标注 CLI 路线 (#170): development/mark-cli-roadmap.md
      - 标注惰性定位: development/mark-locate-lazy.md
      - 标注即时定位: development/mark-locate-eager.md
      - 广场 Plaza: development/plaza.md
      - Bug 汇总: development/bug.md

  - 测试:
      - 概览: test/index.md
      - 发布流程: test/release.md
      - iOS TestFlight: test/ios-testflight.md
      - 发布前 Checklist: test/release-checklist.md

  - Bug 修复记录:
      - macOS 文件保存反复提示不完整改名: bug_fix/watcher-unpaired-rename-toast.md
      - DeepSeek 正文落入 Thinking: bug_fix/deepseek-thinking-body.md
      - ACP 会话恢复 ID 错误: bug_fix/acp-session-resume-id.md
      - 输入法组字 Enter 误发送: bug_fix/ime-composition-enter-submit.md
      - 普通编辑触发全部 Wiki 嵌入闪烁: bug_fix/wiki-embed-unrelated-refresh.md
      - 标题双链稳定性: bug_fix/wikilink-heading-reference-stability.md
      - 拖动 Dockview 分隔条时 PDF 卡顿: bug_fix/dockview-sash-pdf-resize-jank.md
      - PDF 切换视觉截图与后台 ONNX: bug_fix/pdf-switch-visual-crop-layout-onnx.md
      - PDF 版面解析 WebView 崩溃循环: bug_fix/pdf-layout-webview-crash-loop.md
      - 语音答辩语境漂移与字幕串台: bug_fix/voice-defense-context-drift.md
      - 语音答辩开场噪声字幕与重启: bug_fix/voice-defense-opening-noise-captions.md
      - 语音答辩开场回执把答辩重启: bug_fix/voice-defense-opening-ack-gate.md
      - 答辩总结页底栏按钮叠层: bug_fix/voice-defense-ended-footer-overlap.md
      - 远端 ACP PATH / SSH: bug_fix/remote-acp-path-ssh.md
      - 远程 Vault 文件树懒加载: bug_fix/remote-vault-tree-lazy.md
      - macOS 签名与公证: bug_fix/macos-signing.md
      - Gemini 登录弹窗循环: bug_fix/gemini-login-browser-loop.md
      - 导入 NOTES 摘要 MT 超时: bug_fix/import-abstract-mt-timeout.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - fenced_code
  - codehilite

plugins:
  - search

strict: true
