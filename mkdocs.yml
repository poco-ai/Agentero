site_name: Agentero 用户指南
site_description: 在 Agentero 中发现、阅读和整理论文
repo_url: https://github.com/poco-ai/agentero
repo_name: poco-ai/agentero
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  logo: assets/agentero-app-icon.svg
  palette:
    scheme: default
    primary: black
    accent: grey
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - 首页: index.md
  - 开始使用: usage/getting-started.md
  - 发现与管理文献: usage/import-papers.md
  - 阅读、标注与翻译: usage/read-and-organize.md
  - 和 Agent 做研究: usage/agents.md
  - 笔记、实验与写作:
      - 笔记与实验记录: usage/notes-and-tables.md
      - 写作与引用: usage/writing.md
  - 工作区与效率: usage/workspace.md
  - 资料、设备与外部工具: usage/vault.md
  - 遇到问题: usage/help.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - fenced_code
  - codehilite

plugins:
  - search

extra_css:
  - assets/help-center.css

strict: true
